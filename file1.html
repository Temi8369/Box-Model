<!DOCTYPE html>
<html>
    <head>
        <style>
            body {
                display:flex;
                justify-content: center;
                background-color: burlywood;
                font-family: sans-serif, Arial;
            }
            .fact-file {
                background-color: rgba(143, 143, 143, 0.856);
                color: rgb(178, 204, 226);
                width: 260px;
                padding: 25px;
                border: 4px  solid rgb(77, 113, 128);
                margin: 34px;
            }
            .animal-name {
                color: forestgreen;
                font-size: 22px;
            }
            .detail {
                color: chocolate;
            }
            .cool-fact {
                color: cyan;
                font-style: italic;
            }
        </style>
    </head>
    <body>
        <div class="fact-file">
            <h2 class="animal-name"> Snow Leopard</h2> 
            <p class="detail">Type: Big Cat</p>
            <p class="detail">Lives in: Mountain ranges of Central Asia</p>
            <p class="detail">Diet: Deer, goats, and wild sheep</p>
            <p class="cool-fact">Cool Fact: Can leap up to 15 meters in one jump</p>
        </div>
    </body>
</html>
